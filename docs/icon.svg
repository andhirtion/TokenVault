<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#6d5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="62%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0b0616" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="116" fill="#0a0b12"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect width="512" height="512" rx="116" fill="url(#g2)" opacity=".5"/>

  <!-- 盾牌 -->
  <g filter="url(#shadow)">
    <path d="M256 84 122 140v104c0 84 56 148 134 176 78-28 134-92 134-176V140L256 84Z"
          fill="url(#g1)" opacity=".16"/>
    <path d="M256 84 122 140v104c0 84 56 148 134 176 78-28 134-92 134-176V140L256 84Z"
          fill="none" stroke="url(#g1)" stroke-width="17" stroke-linejoin="round"/>
  </g>

  <!-- 对勾 -->
  <path d="M196 262l44 44 78-92" fill="none" stroke="url(#g1)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 底部三个圆点（令牌感） -->
  <g fill="#ffffff" opacity=".34">
    <circle cx="216" cy="352" r="9"/>
    <circle cx="256" cy="352" r="9"/>
    <circle cx="296" cy="352" r="9"/>
  </g>
</svg>