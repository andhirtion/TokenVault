<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="钥匣">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>钥匣 · KeyCoffer — 令牌与密码保险箱</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="styles.css"></noscript>

<!-- ══════════════ 首屏（内联样式，不等外部资源） ══════════════ -->
<style>
  :root {
    --home-bg: #08090d;
    --home-card: rgba(255, 255, 255, .045);
    --home-line: rgba(255, 255, 255, .075);
    --home-text: #eef1f7;
    --home-dim: rgba(238, 241, 247, .52);
    --home-a1: #8b5cf6;
    --home-a2: #38bdf8;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --home-bg: #f5f6fa;
      --home-card: #ffffff;
      --home-line: rgba(15, 18, 30, .08);
      --home-text: #14161f;
      --home-dim: rgba(20, 22, 31, .5);
    }
  }
  html, body { margin: 0; padding: 0; background: var(--home-bg); }
  #home {
    position: fixed; inset: 0; z-index: 900;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 30px) 22px calc(env(safe-area-inset-bottom, 0px) + 22px);
    box-sizing: border-box;
    background: var(--home-bg); color: var(--home-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    opacity: 1; transition: opacity .3s ease, transform .3s ease;
  }
  #home.is-out { opacity: 0; transform: scale(.985); pointer-events: none; }
  #home[hidden] { display: none; }
  .home-aura {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  .home-aura::before, .home-aura::after {
    content: ''; position: absolute; border-radius: 50%; filter: blur(64px); opacity: .5;
  }
  .home-aura::before {
    width: 320px; height: 320px; top: -110px; left: -90px;
    background: radial-gradient(circle, var(--home-a1), transparent 68%);
  }
  .home-aura::after {
    width: 300px; height: 300px; top: -70px; right: -110px;
    background: radial-gradient(circle, var(--home-a2), transparent 68%);
  }
  .home-head { position: relative; display: flex; align-items: center; gap: 13px; }
  .home-logo {
    width: 46px; height: 46px; border-radius: 14px; flex: none;
    background: linear-gradient(140deg, var(--home-a1), var(--home-a2));
    display: grid; place-items: center;
    box-shadow: 0 10px 26px -12px rgba(139, 92, 246, .8);
  }
  .home-logo svg { width: 27px; height: 27px; }
  .home-title { font-size: 21px; font-weight: 680; letter-spacing: -.02em; line-height: 1.15; margin: 0; }
  .home-title small { display: block; font-size: 11.5px; font-weight: 500; color: var(--home-dim); letter-spacing: .06em; margin-top: 3px; }
  .home-hero {
    position: relative; margin: 24px 0 18px;
    font-size: 25.5px; font-weight: 700; letter-spacing: -.03em; line-height: 1.28;
  }
  .home-hero span {
    background: linear-gradient(96deg, var(--home-a1), var(--home-a2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .home-sub { position: relative; margin: -12px 0 22px; font-size: 13.5px; line-height: 1.65; color: var(--home-dim); }
  .home-grid { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .home-card {
    -webkit-tap-highlight-color: transparent;
    appearance: none; border: 1px solid var(--home-line); background: var(--home-card);
    border-radius: 20px; padding: 14px 14px 13px; text-align: left; color: inherit;
    font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 9px;
    transition: transform .16s ease, border-color .2s ease, background .2s ease;
    min-height: 96px; box-sizing: border-box;
  }
  .home-card:active { transform: scale(.972); border-color: rgba(139, 92, 246, .55); }
  .home-card-ico {
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none;
    background: rgba(139, 92, 246, .14); color: #c4b5fd;
  }
  .home-card-ico svg { width: 20px; height: 20px; }
  .home-card[data-go="code"] .home-card-ico { background: rgba(139, 92, 246, .16); color: #c4b5fd; }
  .home-card[data-go="login"] .home-card-ico { background: rgba(56, 189, 248, .16); color: #7dd3fc; }
  .home-card[data-go="note"] .home-card-ico { background: rgba(52, 211, 153, .16); color: #6ee7b7; }
  .home-card[data-go="settings"] .home-card-ico { background: rgba(251, 191, 36, .16); color: #fcd34d; }
  .home-card b { font-size: 14.5px; font-weight: 640; letter-spacing: -.01em; display: block; }
  .home-card em { font-size: 11.5px; color: var(--home-dim); font-style: normal; display: block; margin-top: 3px; line-height: 1.45; }
  .home-tags {
    position: relative; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px;
  }
  .home-tags span {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 11px; border-radius: 999px;
    background: rgba(255, 255, 255, .045); border: 1px solid var(--home-line);
    font-size: 11.5px; color: var(--home-dim);
  }
  .home-tags svg { width: 13px; height: 13px; opacity: .8; flex: none; }
  .home-foot {
    position: relative; margin-top: auto; padding-top: 18px;
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; color: var(--home-dim);
  }
  .home-dot { width: 6px; height: 6px; border-radius: 50%; background: #64748b; flex: none; transition: background .3s; }
  .home-dot.ok { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, .16); }
  .home-dot.load { background: #fbbf24; animation: homePulse 1.1s ease-in-out infinite; }
  @keyframes homePulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .home-spin {
    width: 13px; height: 13px; border-radius: 50%; flex: none;
    border: 1.6px solid rgba(139, 92, 246, .28); border-top-color: var(--home-a1);
    animation: homeSpin .8s linear infinite;
  }
  @keyframes homeSpin { to { transform: rotate(360deg); } }
  .home-spin[hidden] { display: none; }
</style>
</head>
<body>

<!-- ══════════════ 主界面（首屏，选择后才进功能） ══════════════ -->
<div id="home">
  <div class="home-aura"></div>

  <div class="home-head">
    <div class="home-logo">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 5 7.5 11.5v10.7C7.5 32.4 14.7 40.4 24 42.8c9.3-2.4 16.5-10.4 16.5-20.6V11.5L24 5Z"
              stroke="#fff" stroke-width="2.6" stroke-linejoin="round" opacity=".92"/>
        <path d="M17.6 24.2l4.7 4.7 9.1-9.6" stroke="#fff" stroke-width="2.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="home-title">钥匣<small>KEYCOFFER</small></h1>
  </div>

  <h2 class="home-hero">令牌、密码、<br><span>只锁在你这台设备</span></h2>
  <p class="home-sub">先选一个入口，再解锁保险箱。所有内容在本机加密，不上传、不联网同步。</p>

  <div class="home-grid">
    <button class="home-card" data-go="code">
      <span class="home-card-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.4"/><path d="M12 7.8V12l2.9 1.9"/>
        </svg>
      </span>
      <span><b>动态验证码</b><em>Google · 微软 · Steam 等</em></span>
    </button>
    <button class="home-card" data-go="login">
      <span class="home-card-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.4" y="10.2" width="17.2" height="10.4" rx="3.2"/>
          <path d="M7.6 10.2V7.6a4.4 4.4 0 0 1 8.8 0v2.6"/>
        </svg>
      </span>
      <span><b>账号密码</b><em>网站登录凭据</em></span>
    </button>
    <button class="home-card" data-go="note">
      <span class="home-card-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3.6h9.4L20 8.2v12.2H6z"/><path d="M15 3.6v4.8h4.8"/><path d="M9 13h7M9 16.6h4.6"/>
        </svg>
      </span>
      <span><b>密钥笔记</b><em>恢复码 · API Key</em></span>
    </button>
    <button class="home-card" data-go="settings">
      <span class="home-card-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.1"/>
          <path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M5.8 5.8l1.5 1.5M16.7 16.7l1.5 1.5M18.2 5.8l-1.5 1.5M7.3 16.7l-1.5 1.5"/>
        </svg>
      </span>
      <span><b>设置与备份</b><em>指纹 · WebDAV · 导出</em></span>
    </button>
  </div>

  <div class="home-tags">
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="9.5" rx="2.6"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></svg>AES-256 本地加密</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2c2 2.6 4.2 3.6 6.4 3.9-.2 6-3 10.2-6.4 11.7-3.4-1.5-6.2-5.7-6.4-11.7 2.2-.3 4.4-1.3 6.4-3.9Z"/></svg>指纹 / 面容解锁</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.4a4.3 4.3 0 0 1-.5-8.6 5.6 5.6 0 0 1 10.7-1.3A3.9 3.9 0 0 1 18 18.4"/><path d="M12 12.6v6.2M9.8 16.6 12 18.8l2.2-2.2"/></svg>WebDAV 备份</span>
  </div>

  <div class="home-foot">
    <span class="home-spin" id="homeSpin" hidden></span>
    <span class="home-dot" id="homeDot"></span>
    <span id="homeStatus">正在加载…</span>
  </div>
</div>

<!-- ══════════════ 启动/解锁层 ══════════════ -->
<div id="lockScreen" class="lock-screen" hidden>
  <div class="lock-aura"></div>
  <div class="lock-inner">
    <div class="brand-mark" id="brandMark">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="bg1" x1="0" y1="0" x2="48" y2="48">
            <stop offset="0" stop-color="#8b5cf6"/>
            <stop offset="1" stop-color="#38bdf8"/>
          </linearGradient>
        </defs>
        <path d="M24 4 6 11.5v11.2C6 33.1 13.6 41.6 24 44c10.4-2.4 18-10.9 18-21.3V11.5L24 4Z"
              stroke="url(#bg1)" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M17 24.2l4.8 4.8L31.5 19" stroke="url(#bg1)" stroke-width="2.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="lock-title" id="lockTitle">钥匣</h1>
    <p class="lock-sub" id="lockSub">输入访问密码</p>

    <div class="pin-dots" id="pinDots">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="pin-error" id="pinError"></div>

    <div class="keypad" id="keypad">
      <button data-k="1">1</button>
      <button data-k="2">2<em>ABC</em></button>
      <button data-k="3">3<em>DEF</em></button>
      <button data-k="4">4<em>GHI</em></button>
      <button data-k="5">5<em>JKL</em></button>
      <button data-k="6">6<em>MNO</em></button>
      <button data-k="7">7<em>PQRS</em></button>
      <button data-k="8">8<em>TUV</em></button>
      <button data-k="9">9<em>WXYZ</em></button>
      <button data-k="bio" class="key-ghost key-bio" id="bioBtn" hidden aria-label="指纹解锁">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.6a8.4 8.4 0 0 0-8.4 8.4v2.2"/>
          <path d="M20.4 12A8.4 8.4 0 0 0 12 3.6"/>
          <path d="M12 6.8A5.2 5.2 0 0 0 6.8 12v4.3"/>
          <path d="M17.2 12A5.2 5.2 0 0 0 12 6.8"/>
          <path d="M12 10a2 2 0 0 0-2 2v5.4"/>
          <path d="M14 12a2 2 0 0 1 2 2v3.4"/>
        </svg>
      </button>
      <button data-k="0" data-zero>0</button>
      <button data-k="del" class="key-ghost">⌫</button>
    </div>
    <p class="lock-foot">数据仅加密保存在本机 · 不联网同步</p>
  </div>
</div>

<!-- ══════════════ 主应用 ══════════════ -->
<div id="app" class="app" hidden>

  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="topbar-title">
        <span class="eyebrow" id="eyebrow">全部条目</span>
        <h1 id="pageTitle">钥匣<span class="count" id="vaultCount">0</span></h1>
      </div>
      <div class="topbar-actions">
        <button class="grab-btn" id="grabBtn">获取</button>
        <button class="icon-btn" id="searchBtn" aria-label="搜索">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" aria-label="设置">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/>
            <path d="M19.4 14.2a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.84 2.84l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.84-2.84l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.84-2.84l.06.06a1.7 1.7 0 0 0 1.87.34H9.1a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.84 2.84l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03Z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="searchbar" id="searchbar" hidden>
      <svg class="sb-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="searchInput" type="search" placeholder="搜索平台或账号…" autocomplete="off" spellcheck="false">
      <button class="sb-clear" id="searchClear">取消</button>
    </div>

    <div class="chips" id="filterChips">
      <button class="chip is-on" data-filter="all">全部</button>
      <button class="chip" data-filter="favorite">收藏</button>
      <button class="chip" data-filter="code">动态码</button>
      <button class="chip" data-filter="login">账号密码</button>
      <button class="chip" data-filter="note">密钥本</button>
    </div>
  </header>

  <main class="list" id="list"></main>

  <div class="empty" id="emptyState" hidden>
    <div class="empty-art">
      <svg viewBox="0 0 120 120" fill="none">
        <circle cx="60" cy="60" r="46" stroke="rgba(255,255,255,.07)" stroke-width="1.5"/>
        <circle cx="60" cy="60" r="32" stroke="rgba(255,255,255,.05)" stroke-width="1.5" stroke-dasharray="4 6"/>
        <rect x="42" y="52" width="36" height="30" rx="8" stroke="rgba(139,92,246,.55)" stroke-width="2"/>
        <path d="M50 52v-6a10 10 0 0 1 20 0v6" stroke="rgba(56,189,248,.6)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="60" cy="66" r="3" fill="rgba(139,92,246,.8)"/>
      </svg>
    </div>
    <h2 id="emptyTitle">还没有条目</h2>
    <p id="emptyDesc">点击右下角 + 添加你的第一个验证器</p>
  </div>

  <button class="fab" id="fab" aria-label="添加条目">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-on" data-tab="vault">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="4"/><path d="M7.5 10h9M7.5 14.5h5.5"/></svg>
      <span>保险箱</span>
    </button>
    <button class="tab" data-tab="generator">
      <svg viewBox="0 0 24 24"><path d="M12 3.5 4 7v5.5c0 4.6 3.4 8.3 8 9.5 4.6-1.2 8-4.9 8-9.5V7l-8-3.5Z"/><path d="M9.2 12.2l2 2 3.6-3.9"/></svg>
      <span>安全</span>
    </button>
    <button class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<!-- ══════════════ 详情面板 ══════════════ -->
<div class="sheet-scrim" id="detailScrim" hidden></div>
<section class="sheet sheet-detail" id="detailSheet" hidden>
  <div class="sheet-grab"></div>
  <div class="detail-head">
    <div class="detail-icon" id="detailIcon"></div>
    <div class="detail-meta">
      <h2 id="detailName">—</h2>
      <p id="detailAccount">—</p>
    </div>
    <button class="icon-btn" id="detailClose" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="detail-code-wrap" id="detailCodeWrap">
    <div class="detail-code" id="detailCode">000 000</div>
    <div class="detail-ring" id="detailRing">
      <svg viewBox="0 0 44 44">
        <circle class="ring-bg" cx="22" cy="22" r="18"/>
        <circle class="ring-fg" cx="22" cy="22" r="18" id="detailRingFg"/>
      </svg>
      <span id="detailRemain">30</span>
    </div>
  </div>
  <div class="detail-progress" id="detailProgressBar"><i id="detailBar"></i></div>
  <p class="detail-hint" id="detailHint">轻点验证码复制</p>

  <div class="detail-rows" id="detailRows"></div>

  <div class="detail-actions">
    <button class="btn btn-ghost" id="detailCopySecret">复制密钥</button>
    <button class="btn btn-ghost" id="detailEdit">编辑</button>
    <button class="btn btn-danger-ghost" id="detailDelete">删除</button>
  </div>
</section>

<!-- ══════════════ 添加/编辑面板 ══════════════ -->
<div class="sheet-scrim" id="editorScrim" hidden></div>
<section class="sheet sheet-editor" id="editorSheet" hidden>
  <div class="sheet-grab"></div>
  <div class="editor-head">
    <button class="text-btn" id="editorCancel">取消</button>
    <h2 id="editorTitle">添加条目</h2>
    <button class="text-btn accent" id="editorSave">保存</button>
  </div>

  <div class="editor-scroll">
    <div class="seg" id="editorSeg">
      <button class="is-on" data-kind="code">动态验证码</button>
      <button data-kind="login">账号密码</button>
      <button data-kind="note">密钥笔记</button>
    </div>

    <label class="field-label">选择平台</label>
    <button type="button" class="pf-picker" id="pfPicker" aria-expanded="false">
      <span class="pf-picker-ico" id="pfPickerIco"></span>
      <span class="pf-picker-name" id="pfPickerName">自定义</span>
      <span class="pf-picker-cats" id="pfPickerCats">59 个平台</span>

<script>
/* 首屏控制器：先出主界面，app.js 按需加载，慢网也不至于卡在空白/转圈 */
(function () {
  var K = window.KC = { appLoaded: false, appPromise: null, pending: null };

  function setStatus(text, cls) {
    var s = document.getElementById('homeStatus');
    var dot = document.getElementById('homeDot');
    var spin = document.getElementById('homeSpin');
    if (s) s.textContent = text;
    if (dot) dot.className = 'home-dot' + (cls ? ' ' + cls : '');
    if (spin) spin.hidden = cls !== 'load';
  }
  K.status = setStatus;

  K.loadApp = function () {
    if (K.appPromise) return K.appPromise;
    setStatus('正在加载保险箱…', 'load');
    K.appPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'app.js';
      s.onload = function () { K.appLoaded = true; resolve(); };
      s.onerror = function () { K.appPromise = null; reject(new Error('load-fail')); };
      document.body.appendChild(s);
    });
    return K.appPromise;
  };

  K.enter = function (go) {
    K.pending = go || 'vault';
    setStatus('正在打开…', 'load');
    K.loadApp().then(function () {
      if (K.pending !== go) return;
      var home = document.getElementById('home');
      if (home) {
        home.classList.add('is-out');
        setTimeout(function () { home.hidden = true; }, 300);
      }
      document.getElementById('lockScreen').hidden = false;
      if (window.KC_boot) window.KC_boot(K.pending);
      else setTimeout(function () { if (window.KC_boot) window.KC_boot(K.pending); }, 60);
    }).catch(function () {
      setStatus('加载失败，点一下卡片重试', 'err');
      setTimeout(function () { K.appPromise = null; }, 1200);
    });
  };

  document.getElementById('home').addEventListener('click', function (ev) {
    var card = ev.target.closest('.home-card');
    if (card) K.enter(card.getAttribute('data-go'));
  });

  function warm() {
    setStatus('正在预加载…', 'load');
    K.loadApp().then(function () {
      if (!K.pending) setStatus('已就绪 · 点上方卡片进入', 'ok');
    }).catch(function () {
      if (!K.pending) setStatus('点上方卡片进入', '');
    });
  }
  if ('requestIdleCallback' in window) requestIdleCallback(warm, { timeout: 1500 });
  else setTimeout(warm, 700);
})();
</script>
<script>
  // 仅在 https/localhost 下注册离线缓存（file:// 不支持 SW）
  if ('serviceWorker' in navigator && window.isSecureContext && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
